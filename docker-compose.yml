services:
  browser-os-builder:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - TARGETARCH=amd64
    platform: linux/amd64
    container_name: browser-os-build
    privileged: true
    working_dir: /workspace
    tty: true
    stdin_open: true
    environment:
      - TERM=xterm-256color
    volumes:
      - ./output:/workspace/output
      - .:/workspace:cached
      - /workspace/build/work
    ports:
      - "2222:22"
    command: /bin/bash -c "/usr/sbin/sshd -D"
    networks:
      - browser-os-network

networks:
  browser-os-network:
    driver: bridge
