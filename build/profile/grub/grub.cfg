# Load partition module
insmod part_gpt
insmod part_msdos

# Load file system modules
insmod fat
insmod iso9660

# Set default boot entry
set default=0
set timeout=3
set timeout_style=menu

# Set appearance
set menu_color_normal=white/black
set menu_color_highlight=black/light-gray

# Menu entries
menuentry "Browser OS" --class arch --class gnu-linux --class gnu --class os {
    set gfxpayload=keep
    search --no-floppy --set=root --label BROWSER_OS
    linux /arch/boot/x86_64/vmlinuz-linux archisobasedir=arch archisolabel=BROWSER_OS quiet loglevel=0 rd.loglevel=0 udev.log_level=0 vt.global_cursor_default=0 rd.systemd.show_status=false rd.udev.log_level=0 systemd.show_status=false systemd.log_level=0 console=tty0 plymouth.enable=1 plymouth:ignore-serial-consoles splash fbcon=nodefer i915.modeset=1 nouveau.modeset=1 radeon.modeset=1 amdgpu.modeset=1
    initrd /arch/boot/x86_64/initramfs-linux.img
}

menuentry "Browser OS (Debug Mode)" --class arch --class gnu-linux --class gnu --class os {
    set gfxpayload=keep
    search --no-floppy --set=root --label BROWSER_OS
    linux /arch/boot/x86_64/vmlinuz-linux archisobasedir=arch archisolabel=BROWSER_OS systemd.log_level=debug systemd.show_status=true rd.systemd.show_status=true console=tty0 plymouth.enable=0 DEBUG_TRANSITION=1
    initrd /arch/boot/x86_64/initramfs-linux.img
}

menuentry "Browser OS (Emergency Shell)" --class arch --class gnu-linux --class gnu --class os {
    set gfxpayload=keep
    search --no-floppy --set=root --label BROWSER_OS
    linux /arch/boot/x86_64/vmlinuz-linux archisobasedir=arch archisolabel=BROWSER_OS systemd.unit=emergency.target console=tty0 plymouth.enable=0
    initrd /arch/boot/x86_64/initramfs-linux.img
}

# Hide GRUB unless shift is pressed
grub_timeout_style=hidden
grub_timeout=0
