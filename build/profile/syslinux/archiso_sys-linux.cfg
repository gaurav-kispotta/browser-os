LABEL arch64
TEXT HELP
Boot the Browser OS install medium on BIOS.
It allows you to install Browser OS or perform system maintenance.
ENDTEXT
MENU LABEL Browser OS install medium (x86_64, BIOS)
LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet loglevel=0 rd.loglevel=0 udev.log_level=0 vt.global_cursor_default=0 rd.systemd.show_status=false rd.udev.log_level=0 systemd.show_status=false systemd.log_level=0 console=tty0 plymouth.enable=1 plymouth:ignore-serial-consoles splash fbcon=nodefer

# Accessibility boot option
LABEL arch64speech
TEXT HELP
Boot the Browser OS install medium on BIOS with speakup screen reader.
It allows you to install Browser OS or perform system maintenance with speech feedback.
ENDTEXT
MENU LABEL Browser OS install medium (x86_64, BIOS) with ^speech
LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% accessibility=on quiet loglevel=0 rd.loglevel=0 udev.log_level=0 vt.global_cursor_default=0 rd.systemd.show_status=false rd.udev.log_level=0 systemd.show_status=false systemd.log_level=0 console=tty0 plymouth.enable=1 plymouth:ignore-serial-consoles splash fbcon=nodefer
