LABEL arch64
TEXT HELP
Boot the Browser OS in live mode.
It allows you to try Browser OS without installing.
ENDTEXT
MENU LABEL Browser OS (Live Mode) - (x86_64, BIOS)
LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet loglevel=3 udev.log_level=3 vt.global_cursor_default=1 rd.systemd.show_status=false rd.udev.log_level=3 systemd.show_status=false plymouth.enable=1 plymouth:ignore-serial-consoles splash

LABEL install
TEXT HELP
Install Browser OS to your hard disk using the dialog-based installer.
ENDTEXT
MENU LABEL ^Install Browser OS - (x86_64, BIOS)
LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet loglevel=3 udev.log_level=3 vt.global_cursor_default=1 rd.systemd.show_status=false rd.udev.log_level=3 systemd.show_status=false plymouth.enable=1 plymouth:ignore-serial-consoles splash script=browser-os-installer

# Accessibility boot option
LABEL arch64speech
TEXT HELP
Boot the Browser OS install medium on BIOS with speakup screen reader.
It allows you to install Browser OS or perform system maintenance with speech feedback.
ENDTEXT
MENU LABEL Browser OS install medium (x86_64, BIOS) with ^speech
LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% accessibility=on quiet plymouth.enable=1 plymouth:ignore-serial-consoles splash
