title    Browser OS Linux install medium (x86_64, UEFI)
sort-key 01
linux    /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
initrd   /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
options  archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet loglevel=0 rd.loglevel=0 udev.log_level=0 vt.global_cursor_default=0 rd.systemd.show_status=false rd.udev.log_level=0 systemd.show_status=false systemd.log_level=0 console=tty0 plymouth.enable=1 plymouth:ignore-serial-consoles splash fbcon=nodefer

